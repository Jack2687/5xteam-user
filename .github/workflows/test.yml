name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run test:push-groups
          npm run test:pro-vm
          npm run test:pipeline-selection
          npm run test:quality-groups
          npm run test:quality-vm
          npm run build
      - run: go test ./... -timeout 10m
      - run: go vet ./...
      - run: go build ./cmd/server
